services:
  - type: web
    name: finova-planning-engine
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 90
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: GOOGLE_AI_STUDIO_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
